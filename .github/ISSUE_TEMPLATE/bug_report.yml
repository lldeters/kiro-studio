name: Bug report
description: Something in Kiro Studio does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security problem goes to the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open a folder with …
        2. Ask Kiro to …
        3. …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Kiro Studio, VS Code (Help > About) and the Kiro CLI (`kiro-cli --version`).
      placeholder: Kiro Studio 0.1.0, VS Code 1.105.1, kiro-cli 2.33.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Remote (SSH, WSL, container)]
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Protocol log
      description: |
        Kiro Studio: Show Protocol Log, the lines around the problem. Tokens, e-mail addresses and your home folder are
        hidden, but read the lines before you paste them: file names and the text of the conversation are not.
      render: text
